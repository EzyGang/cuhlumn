[package]
name = "cuhlumn-server"
description = "Server that hosts many blogs, each on its own domain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
cuhlumn-api.workspace = true
flate2 = "1"
getrandom = "0.4"
hex = "0.4"
maud = "0.27.0"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
sha2 = "0.11"
subtle = "2"
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
