[workspace]
members = ["crates/api", "crates/cli", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EzyGang/cuhlumn"

[workspace.dependencies]
cuhlumn-api = { path = "crates/api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true
