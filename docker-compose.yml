# Runs Cuhlumn, and optionally a Cloudflare tunnel in front of it.
# Copy .env.example to .env to set the variables.
# Start the tunnel with: docker compose --profile tunnel up -d

name: cuhlumn

services:
  cuhlumn:
    image: ${CUHLUMN_IMAGE:-ghcr.io/ezygang/cuhlumn:latest}
    build: .
    ports:
      - "127.0.0.1:${CUHLUMN_PORT:-8080}:8080"
      # The admin port. Nothing listens on it while CUHLUMN_ADMIN_ADDR is not set.
      - "${CUHLUMN_ADMIN_PUBLISH:-127.0.0.1:8081}:8081"
    # A name without a value passes the variable only when it is set.
    environment:
      - CUHLUMN_TOKEN
      - CUHLUMN_CONSOLE_HOST
      - CUHLUMN_SCHEME
      - CUHLUMN_ADMIN_ADDR
      - RUST_LOG
    volumes:
      - cuhlumn-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "cuhlumn-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      start_interval: 2s
      retries: 3
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    # The tunnel profile needs CLOUDFLARE_TUNNEL_TOKEN.
    # A required-variable check would also stop the other services, because Compose reads every service.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      cuhlumn:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  cuhlumn-data:
