# Runs Cuhlumn. Both ports are published only on 127.0.0.1 of the host.
# Put your own reverse proxy, such as nginx or Caddy, in front of them.
# Copy .env.example to .env to set the variables.

name: cuhlumn

services:
  cuhlumn:
    image: ${CUHLUMN_IMAGE:-ghcr.io/ezygang/cuhlumn:latest}
    build: .
    ports:
      - "127.0.0.1:${CUHLUMN_PORT:-8080}:8080"
      # The admin port. Nothing listens on it while CUHLUMN_ADMIN_ADDR is not set.
      - "127.0.0.1:${CUHLUMN_ADMIN_PORT:-8081}:8081"
    # A name without a value passes the variable only when it is set.
    environment:
      - CUHLUMN_TOKEN
      - CUHLUMN_CONSOLE_HOST
      - CUHLUMN_SCHEME
      - CUHLUMN_ADMIN_ADDR
      - RUST_LOG
    volumes:
      - cuhlumn-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "cuhlumn-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      start_interval: 2s
      retries: 3
    restart: unless-stopped

volumes:
  cuhlumn-data:
