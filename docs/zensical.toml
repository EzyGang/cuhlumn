[project]
site_name = "Cuhlumn Documentation"
site_description = "Installation, platform, management console, configuration, and HTTP API documentation for Cuhlumn."
site_url = "https://cuhlumn.ezygang.digital/"
docs_dir = "content"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Overview" = "getting-started/index.md" },
    { "Installation" = "getting-started/installation.md" },
    { "Quick start" = "getting-started/quickstart.md" },
  ] },
  { "Platform" = [
    { "Sites and domains" = "platform/sites.md" },
    { "Posts, pages, and drafts" = "platform/posts.md" },
    { "Appearance" = "platform/appearance.md" },
    { "Announcements" = "platform/announcements.md" },
    { "Media" = "platform/media.md" },
    { "Analytics" = "platform/analytics.md" },
    { "Public pages" = "platform/public-pages.md" },
    { "Search and AI discovery" = "platform/discovery.md" },
    { "Share images" = "platform/share-images.md" },
    { "Caching" = "platform/caching.md" },
  ] },
  { "Management console" = "console/index.md" },
  { "Command-line client" = "cli/index.md" },
  { "Operations" = [
    { "Configuration" = "operations/configuration.md" },
    { "Security" = "operations/security.md" },
    { "Data and backups" = "operations/data.md" },
    { "Cloudflare" = "operations/cloudflare.md" },
  ] },
  { "API reference" = [
    { "Overview" = "reference/api.md" },
    { "Sites" = "reference/sites.md" },
    { "Posts" = "reference/posts.md" },
    { "Media" = "reference/media.md" },
    { "Preview" = "reference/preview.md" },
    { "Server settings" = "reference/settings.md" },
    { "Fonts" = "reference/fonts.md" },
    { "Analytics" = "reference/analytics.md" },
    { "Sessions" = "reference/sessions.md" },
    { "Value types" = "reference/value-types.md" },
    { "Errors" = "reference/errors.md" },
  ] },
  { "Under the hood" = "concepts/how-it-works.md" },
  { "Development" = "development/index.md" },
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.path",
  "navigation.tracking",
  "navigation.top",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
  "content.code.select",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep-orange"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep-orange"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.meta-descriptions]
trim = true

[project.plugins.social]

[project.plugins.privacy]
assets_include = ["fonts.googleapis.com/*", "fonts.gstatic.com/*"]

[project.plugins.llmstxt]
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Getting started" = ["index.md", "getting-started/*.md"]
"Platform" = ["platform/*.md"]
"Management console" = ["console/*.md"]
"Command-line client" = ["cli/*.md"]
"Operations" = ["operations/*.md"]
"HTTP API reference" = ["reference/*.md"]
"Under the hood" = ["concepts/*.md"]
"Development" = ["development/*.md"]

# Zensical's default Markdown extensions, listed in full because setting one option replaces
# the whole default set. The only change is anchor_linenums: line-number anchors are links
# without text, which screen readers and Lighthouse report on every page with a code block.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = false
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
